## all — shells
# zshenv/zprofile are `forcelink`: PATH/env lives in zshenv only — zprofile is
# login-only and must not source profile. Force-correct repo-managed symlinks
# so a pull of the split files can't leave ~/.zshenv pointing at the empty
# zprofile stub (breaks Homebrew on PATH).
link|all|.profile|shells/profile
forcelink|all|.zshenv|shells/zshenv
forcelink|all|.zprofile|shells/zprofile
link|all|.zshrc|shells/zshrc
link|all|.bashrc|shells/bashrc
link|all|.bash_profile|shells/bash_profile
link|all|.sh_aliases|shells/sh_aliases
link|all|.inputrc|shells/inputrc
link|all|.oh-my-zsh/themes/digitalnomad.zsh-theme|shells/digitalnomad.zsh-theme
copy|all|.user-env|shells/user-env

