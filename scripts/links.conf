# links.conf — single source of truth for deploy.sh links/copies.
# Both deploy.sh and scripts/doctor.sh read this file: add a line here and both
# setup and health-checks pick it up. Only truly bespoke logic (oh-my-zsh
# install, agent-skills merge, iCloudDrive, virtualenvs hooks, ssh config.d
# placeholder) lives in the scripts themselves.
#
# format: mode|scope|target|source
#   mode:   link      — guarded ln -s (skip if anything exists at target)
#           force     — unconditional ln -sfn (replaces repo-managed paths;
#                       a non-symlink dir at target is removed first)
#           forcelink — ln -sfn only if target is a symlink or missing
#                       (protects hand-written local files)
#           copy      — guarded cp -rp (copy-once baseline; local edits win)
#   scope:  all | mac
#   target: path relative to $HOME (or absolute, e.g. /Applications/...)
#   source: path relative to the repo root
#
# lines starting with # and blank lines are ignored
#
# note: absolute targets (e.g. /Applications/...) are real-system paths —
# they are NOT scoped to $HOME, so test harnesses running deploy.sh against
# a temp HOME will still touch them

## mac — shell / git / ssh
link|mac|.ssh/config|utils/ssh_config
link|mac|.gitconfig|utils/gitconfig
link|mac|.ideavimrc|editors/ideavimrc
force|mac|.config/git/hooks|utils/git-hooks
link|mac|.cursor/rules/no-cursor-attribution.mdc|utils/cursor/rules/no-cursor-attribution.mdc

