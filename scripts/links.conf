link|all|.emacs|editors/emacs.el
link|all|.emacs.d/emacs-config.org|editors/emacs-config.org
link|all|.emacs.d/lisp|editors/emacs.d/lisp
link|all|.emacs.d/snippets|editors/emacs.d/snippets
link|all|.config/nvim|editors/nvim
link|all|.editorconfig|editors/editorconfig
link|all|.eslintrc.json|utils/eslintrc.json
link|all|.prettierrc.json|utils/prettierrc.json
link|all|jsconfig.json|utils/jsconfig.json
