# links.conf — single source of truth for deploy.sh links/copies.
# Both deploy.sh and scripts/doctor.sh read this file: add a line here and both
# setup and health-checks pick it up. Only truly bespoke logic (oh-my-zsh
# install, agent-skills merge, iCloudDrive, virtualenvs hooks, ssh config.d
# placeholder) lives in the scripts themselves.
#
# format: mode|scope|target|source
#   mode:   link      — guarded ln -s (skip if anything exists at target)
#           force     — unconditional ln -sfn (replaces repo-managed paths;
#                       a non-symlink dir at target is removed first)
#           forcelink — ln -sfn only if target is a symlink or missing
#                       (protects hand-written local files)
#           copy      — guarded cp -rp (copy-once baseline; local edits win)
#   scope:  all | mac | linux
#   target: path relative to $HOME (or absolute, e.g. /Applications/...)
#   source: path relative to the repo root
#
# lines starting with # and blank lines are ignored
#
# note: absolute targets (e.g. /Applications/...) are real-system paths —
# they are NOT scoped to $HOME, so test harnesses running deploy.sh against
# a temp HOME will still touch them

## mac — shell / git / ssh
link|mac|.ssh/config|utils/ssh_config
link|mac|.gitconfig|utils/gitconfig
link|mac|.ideavimrc|editors/ideavimrc
force|mac|.config/git/hooks|utils/git-hooks
link|mac|.cursor/rules/no-cursor-attribution.mdc|utils/cursor/rules/no-cursor-attribution.mdc
# tmux prefers ~/.tmux.conf over the XDG path — on omarchy/linux the XDG
# config omarchy ships stays authoritative, so this link is mac-only
link|mac|.tmux.conf|utils/tmux.conf
# omarchy owns ~/.bashrc (it sources its bash rc chain); the repo's minimal
# bashrc would clobber it, so mac-only
link|mac|.bashrc|shells/bashrc
link|mac|.bash_profile|shells/bash_profile

## mac — tools and app support
link|mac|bin/reload-safari.scpt|utils/reload-safari.scpt
link|mac|bin/reload-chrome.scpt|utils/reload-chrome.scpt
link|mac|bin/macos-reset-routing-table.sh|utils/macos-reset-routing-table.sh
link|mac|Library/Application Support/espanso/match/common.yml|utils/espanso/common.yml
copy|mac|Library/Application Support/espanso/match/private.yml|utils/espanso/private.yml
link|mac|.config/karabiner/assets/complex_modifications/custom.json|utils/karabiner/custom.json
link|mac|.config/ghostty/config|utils/ghostty/config

## mac — copy-once baselines
copy|mac|.gitconfig-local|utils/gitconfig-local
copy|mac|.gitconfig.d|utils/gitconfig.d
copy|mac|.clojure/deps.edn|utils/deps.edn
copy|mac|.lein/profiles.clj|utils/lein_profiles.clj

## linux — git / misc (gitconfig is a per-OS fork: utils/gitconfig_linux has
## no osxkeychain credential helper; ssh_config is a per-OS fork without the
## mac colima Include; git reads ~/.gitconfig plus omarchy's XDG config
## together, and repo wins on conflicts)
link|linux|.ssh/config|utils/ssh_config_linux
link|linux|.gitconfig|utils/gitconfig_linux
link|linux|.ideavimrc|editors/ideavimrc
force|linux|.config/git/hooks|utils/git-hooks
link|linux|.cursor/rules/no-cursor-attribution.mdc|utils/cursor/rules/no-cursor-attribution.mdc

## linux — copy-once baselines
copy|linux|.gitconfig-local|utils/gitconfig-local
copy|linux|.gitconfig.d|utils/gitconfig.d
copy|linux|.clojure/deps.edn|utils/deps.edn
copy|linux|.lein/profiles.clj|utils/lein_profiles.clj

## all — shells
# zshenv/zprofile are `forcelink`: PATH/env lives in zshenv only — zprofile is
# login-only and must not source profile. Force-correct repo-managed symlinks
# so a pull of the split files can't leave ~/.zshenv pointing at the empty
# zprofile stub (breaks Homebrew on PATH).
link|all|.profile|shells/profile
forcelink|all|.zshenv|shells/zshenv
forcelink|all|.zprofile|shells/zprofile
link|all|.zshrc|shells/zshrc
link|all|.sh_aliases|shells/sh_aliases
link|all|.inputrc|shells/inputrc
link|all|.oh-my-zsh/themes/digitalnomad.zsh-theme|shells/digitalnomad.zsh-theme
copy|all|.user-env|shells/user-env

## all — editors / linting
link|all|.emacs|editors/emacs.el
link|all|.emacs.d/emacs-config.org|editors/emacs-config.org
link|all|.emacs.d/lisp|editors/emacs.d/lisp
link|all|.emacs.d/snippets|editors/emacs.d/snippets
link|all|.config/nvim|editors/nvim
link|all|.editorconfig|editors/editorconfig
link|all|.eslintrc.json|utils/eslintrc.json
link|all|.prettierrc.json|utils/prettierrc.json
link|all|jsconfig.json|utils/jsconfig.json
link|all|.zprint.edn|utils/zprint.edn

## linux — omarchy customizations (owned from omarchy/; see omarchy/README.md)
# force: the live files are repo-managed and identical — replace unconditionally
force|linux|.config/hypr/bindings.lua|omarchy/hypr/bindings.lua
force|linux|.config/hypr/input.lua|omarchy/hypr/input.lua
# hyprland.lua was previously stock omarchy; vendored for the float-on-top
# window rules (see omarchy/README.md "focus on open"). It is the file that
# holds personal window rules; watch for omarchy template changes on update.
force|linux|.config/hypr/hyprland.lua|omarchy/hypr/hyprland.lua
force|linux|.config/omarchy/shell.json|omarchy/shell.json
force|linux|.config/omarchy/moom.conf|omarchy/moom.conf
# session-wide SHELL so ghostty etc. launch zsh even when systemd's user
# manager survives a re-login with a stale pre-chsh value
link|linux|.config/environment.d/90-dotfiles-shell.conf|omarchy/env/90-shell.conf
# ghostty config is owned (vendored from the live omarchy one) — note:
# omarchy's text-size slider sed -i's this path and would replace the
# symlink with a regular file; terminal size changes are repo edits now
force|linux|.config/ghostty/config|omarchy/ghostty/config
link|linux|.local/bin/omarchy-moom|omarchy/bin/omarchy-moom
link|linux|.local/bin/omarchy-quit-app|omarchy/bin/omarchy-quit-app
link|linux|.local/bin/omarchy-window-raise-front|omarchy/bin/omarchy-window-raise-front
# focus-on-open daemon + its user unit (deploy.sh enables the unit on arch)
link|linux|.local/bin/focus-new-windows|omarchy/bin/focus-new-windows
link|linux|.config/systemd/user/focus-new-windows.service|omarchy/systemd/user/focus-new-windows.service
