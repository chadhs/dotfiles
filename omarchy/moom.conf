# omarchy-moom mode. See ~/Work/moom-omarchy-plan.md.
#
#   planA  Every Moom chord floats the window if needed and places it at the
#          literal grid cell. Layout-independent (works the same on dwindle,
#          scrolling, or fully floating). "fill" = fill the screen area.
#
#   planB  On tiled windows, directional chords swap toward that side then
#          resize the tiled split; "fill" = Hyprland fullscreen toggle.
#
MOOM_MODE=planA
