name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (sh scripts)
        # weekly-update.sh is zsh; shellcheck only supports sh/bash/dash/ksh
        run: shellcheck deploy.sh scripts/bootstrap-mac.sh scripts/macos-defaults.sh scripts/doctor.sh
      - name: link manifest lint
        run: |
          awk -F'|' '
            /^[[:space:]]*(#|$)/ { next }
            NF != 4                              { print "links.conf:" NR ": expected mode|scope|target|source"; exit 1 }
            $1 !~ /^(link|force|forcelink|copy)$/ { print "links.conf:" NR ": bad mode " $1; exit 1 }
            $2 !~ /^(mac|all|linux)$/             { print "links.conf:" NR ": bad scope " $2; exit 1 }
            $3 == "" || $4 == ""                  { print "links.conf:" NR ": empty target/source"; exit 1 }
          ' scripts/links.conf && echo "links.conf OK"
      - name: Thunderbird theme and preference JSON
        run: |
          python3 utils/thunderbird/build-theme.py --output "$RUNNER_TEMP/solarized-omarchy.xpi"
          python3 utils/thunderbird/build-picker-focus.py --output "$RUNNER_TEMP/quickmove-focus.xpi"
          python3 -m json.tool utils/thunderbird/preferences.json > /dev/null
          python3 -m json.tool utils/thunderbird/tbkeys-settings.json > /dev/null
          python3 -B -m unittest discover -s utils/thunderbird -p "test_*.py"
          node --test utils/thunderbird/test_picker_focus.cjs
      - name: syntax check (sh scripts)
        run: |
          sh -n deploy.sh
          for f in scripts/*.sh; do sh -n "$f"; done
      - name: syntax check (zsh script)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          zsh -n scripts/weekly-update.sh

  editors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.6
      - uses: jcs090218/setup-emacs@master
        with:
          version: '30.2'
      - name: shared Neovim regression tests
        run: nvim --headless -u NONE -i NONE -n -l windows/tests/nvim.lua
      - name: shared Emacs regression tests
        run: emacs --batch -Q -l windows/tests/emacs-tests.el -f ert-run-tests-batch-and-exit
      - name: Windows deployment safety
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOTFILES_TEST_TEMP: ${{ runner.temp }}
        run: ./windows/tests/deploy.Tests.ps1
